# tmux config - Catppuccin Mocha theme, vim-style panes, agent-deck friendly

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h
bind - split-window -v

# reload config
bind r source-file ~/.tmux.conf \; display "config reloaded"

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sessionx'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

set -g @sessionx-bind 'o'

# agent-deck hook: keep session names visible in the status bar so agent
# sessions are easy to pick out at a glance
set -g status-left-length 40
set -g status-left "#[fg=green]#S #[fg=default]"

# auto-install TPM on first run
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bindings/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
