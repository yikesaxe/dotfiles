# tmux config - Catppuccin Mocha theme, vim-style panes, agent-deck friendly

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -g escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g allow-rename on
set -g set-clipboard on
set -g status-position top

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# swap windows left/right
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

bind Tab last-window
bind Enter copy-mode
bind + resize-pane -Z

# reload config
bind r source-file ~/.tmux.conf \; display "config reloaded"

# vi copy mode
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'omerxx/tmux-sessionx'

set -g @catppuccin_flavor 'mocha'
# 'rounded' window tabs need a solid status-bar background for their
# reverse-video corners to work, so keep tabs 'basic' (plain text) while
# the bar itself is transparent; the session/directory/git/time pills
# below round themselves regardless of the bar's background
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_status_background 'none'

# agent-deck hook: session name in the status bar, stripped of agent-deck's
# agentdeck_ prefix/suffix so sessions are easy to pick out at a glance
set -g @catppuccin_session_text " #(echo '#{session_name}' | sed 's/^agentdeck_//;s/_[^_]*$//')"
set -g status-left-length 40
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_gitmux}#{E:@catppuccin_status_date_time}"

# round the end caps of the session/directory/git/time pills (they
# default to empty separators, i.e. flat rectangles)
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""

set -g @sessionx-bind 'o'

# clear agent-deck's per-session theme overrides
set-hook -g session-created "set -u status-style; set -u status-left; set -u status-right; set -u status-left-length; set -u status-right-length; set -u window-status-format; set -u window-status-current-format"
set-hook -g client-session-changed "set -u status-style; set -u status-left; set -u status-right; set -u status-left-length; set -u status-right-length; set -u window-status-format; set -u window-status-current-format"

# auto-install TPM on first run
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bindings/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# hand-build rounded window-tab caps instead of using
# @catppuccin_window_status_style 'rounded' - that style leans on
# reverse-video against the status bar's own background, which breaks
# once the bar is transparent (bg=none isn't a real color to reverse
# into). This mirrors the same self-contained pill technique the
# session/directory/etc modules already use above.
set -g window-status-format "#[fg=#{@thm_overlay_2},bg=default]#[fg=#11111b,bg=#{@thm_overlay_2}] #I #[fg=#cdd6f4,bg=#{@thm_surface_0}] #T #[fg=#{@thm_surface_0},bg=default]"
set -g window-status-current-format "#[fg=#{@thm_mauve},bg=default]#[fg=#11111b,bg=#{@thm_mauve}] #I #[fg=#cdd6f4,bg=#{@thm_surface_1}] #T #[fg=#{@thm_surface_1},bg=default]"


set -g window-style default
set -g window-active-style default
